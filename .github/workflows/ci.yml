name: TypeScript
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm pack
      - run: |
          archive="$PWD/$(node -p 'require("./package.json").name.replace("@", "").replace("/", "-") + "-" + require("./package.json").version + ".tgz"')"
          package_test="$(mktemp -d)"
          node --input-type=module -e 'import fs from "node:fs"; const fixture = JSON.parse(fs.readFileSync("testdata/signing-bundles.json")); fs.writeFileSync(process.argv[1], JSON.stringify(fixture.cases[0].response.bundle));' "$package_test/bundle.json"
          cd "$package_test"
          npm init -y
          npm install "$archive"
          node --input-type=module -e 'import {parseNocks} from "@swpsco/nockchain"; if (parseNocks("1.25") !== 81920n) throw Error("package smoke test");'
          ./node_modules/.bin/nockchain inspect bundle.json
