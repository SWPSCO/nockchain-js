name: TypeScript
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm pack
      - run: |
          archive="$PWD/$(node -p 'require("./package.json").name.replace("@", "").replace("/", "-") + "-" + require("./package.json").version + ".tgz"')"
          package_test="$(mktemp -d)"
          cd "$package_test"
          npm init -y
          npm install "$archive"
          node --input-type=module -e 'import {parseNocks} from "@swpsco/nockchain"; if (parseNocks("1.25") !== 81920n) throw Error("package smoke test");'
